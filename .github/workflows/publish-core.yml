name: Publish core to builds branch
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID to publish'
        required: true
      artifact:
        description: 'Artifact name'
        default: x1box_libretro-android-arm64-v8a
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out
      - name: Push to builds branch
        run: |
          cd out
          ls -la
          git init -q
          git checkout -q -b builds
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "${{ inputs.artifact }} from run ${{ inputs.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
